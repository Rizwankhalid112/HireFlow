<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#2563EB" />
    <meta
      name="description"
      content="One master CV, tailored to each job. HireFlow shows which of a posting's keywords your CV already covers, which it only words differently, and which it genuinely lacks."
    />

    <!-- Set the theme class before first paint, so a dark-mode reload never
         flashes the light palette on its way to the right one. -->
    <script>
      try {
        const stored = localStorage.getItem('hireflow-theme');
        const dark = stored ? stored === 'dark'
          : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />

    <title>HireFlow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
