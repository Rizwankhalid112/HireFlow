[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py

# Only our apps: the repo carries a checked-out venv/ whose site-packages are
# full of third-party test modules that would otherwise be collected.
testpaths = apps

markers =
    slow: renders every template — excluded from a fast local run with `-m "not slow"`

addopts = --strict-markers
